name: Shelly Manager
version: "0.3.1"
slug: shelly_manager
description: Inventory, config history, settings editor and firmware updates for Shelly Gen2+ devices
url: https://github.com/atsoc0ocsav/shelly_manager
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt
panel_title: Shelly Manager
panel_admin: true
backup: hot
map:
  # Read-only, to discover devices and credentials from the Shelly integration
  # (.storage/core.config_entries). Turn the option off if you do not want that.
  - type: homeassistant_config
    read_only: true
options:
  use_ha_shelly_integration: true
  snapshot_remote: ""
  poll_interval_minutes: 15
  allow_any_firmware_url: false
schema:
  use_ha_shelly_integration: bool
  snapshot_remote: str?
  poll_interval_minutes: int(5,1440)
  allow_any_firmware_url: bool

{% extends "base.html" %}
{% block title %}Log in · Shelly Manager{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="alert err" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ base }}/login">
  <p><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus></p>
  <p><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></p>
  <button class="btn btn-primary" type="submit">Log in</button>
</form>
{% endblock %}

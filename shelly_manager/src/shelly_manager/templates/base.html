<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Shelly Manager{% endblock %}</title>
<style>
:root {
  --c-primary: hsl(212, 80%, 42%);
  --c-neutral: hsl(220, 10%, 40%);
  --c-success: hsl(140, 60%, 30%);
  --c-warning: hsl(38, 90%, 35%);
  --c-error: hsl(0, 72%, 45%);
  --c-bg: hsl(220, 20%, 98%);
  --c-border: hsl(220, 12%, 85%);
}
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: hsl(220, 20%, 15%); background: var(--c-bg); }
.skip { position: absolute; left: -999px; } .skip:focus { left: 8px; top: 8px; background: #fff; padding: 8px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 24px; background: #fff; border-bottom: 1px solid var(--c-border); }
header a { color: inherit; text-decoration: none; font-weight: 600; }
main { padding: 24px; max-width: 1280px; margin: 0 auto; }
h1 { font-size: 25px; line-height: 1.25; margin: 0 0 16px; } h2 { font-size: 20px; margin: 24px 0 8px; }
table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--c-border); vertical-align: top; }
th { font-size: 14px; color: var(--c-neutral); }
a { color: var(--c-primary); }
.btn { min-height: 40px; padding: 8px 16px; border-radius: 8px; font: inherit; cursor: pointer; border: 1px solid var(--c-primary); background: #fff; color: var(--c-primary); }
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-danger { border-color: var(--c-error); color: var(--c-error); }
.btn:hover { filter: brightness(0.95); } .btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
.badge { display: inline-block; padding: 0 8px; border-radius: 8px; font-size: 14px; border: 1px solid currentColor; }
.ok { color: var(--c-success); } .warn { color: var(--c-warning); } .err { color: var(--c-error); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
form.inline { display: inline; }
pre, textarea { font: 14px/1.5 ui-monospace, monospace; background: #fff; border: 1px solid var(--c-border); border-radius: 8px; padding: 12px; overflow: auto; max-height: 70vh; }
textarea { width: 100%; min-height: 50vh; }
label { display: block; font-weight: 600; margin-bottom: 4px; }
input[type=text], input[type=password] { min-height: 40px; padding: 8px; font: inherit; border: 1px solid var(--c-neutral); border-radius: 8px; width: 100%; max-width: 360px; }
.alert { padding: 12px 16px; border-radius: 8px; border: 1px solid currentColor; background: #fff; margin: 16px 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@keyframes sm-spin { to { transform: rotate(360deg); } }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sm-spin .8s linear infinite; vertical-align: -1px; }
.diff-add { color: var(--c-success); } .diff-del { color: var(--c-error); }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>
<script src="{{ base }}/static/app.js" defer></script>
</head>
<body data-state-url="{{ base }}/api/state" data-version="{{ version }}">
<a class="skip" href="#main">Skip to content</a>
<header>
  <nav aria-label="Main navigation"><a href="{{ base }}/">Shelly Manager</a></nav>
  {% if user and not ha_mode %}
  <div class="row" style="margin:0">
  <a href="{{ base }}/account" style="font-weight:400">Account</a>
  <form class="inline" method="post" action="{{ base }}/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="btn" type="submit">Log out</button>
  </form>
  </div>
  {% endif %}
</header>
<main id="main">
{% block content %}{% endblock %}
</main>
</body>
</html>

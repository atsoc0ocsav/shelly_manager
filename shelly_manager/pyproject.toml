[project]
name = "shelly-manager"
version = "0.5.2"
description = "Inventory, config history, settings editor and firmware updates for Shelly Gen2+ devices"
requires-python = ">=3.12,<3.14"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Vasco Craveiro Costa" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "bcrypt>=4,<6",
    "python-multipart>=0.0.9,<1",
    "itsdangerous>=2.1,<3",
]

[project.scripts]
shelly-manager = "shelly_manager.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelly_manager"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
